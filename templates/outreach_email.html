<!DOCTYPE html>
<html>
<head>
<!-- No layout table, no background color, no card/box - a cold outreach
     pitch should read exactly like a normal person's email, not a
     template. (templates/email_template.html, the manual-campaign one,
     is a separate file and keeps its branded look - that's intentional,
     this one is not it.) -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; color:#202124; font-size:14px; line-height:1.6;">
{{ message | safe }}
<p style="color:#6b7280; font-size:12px; margin-top:28px;">
  <a href="{{ unsubscribe_url }}" style="color:#6b7280;">Unsubscribe</a>
</p>
<img src="{{ pixel_url }}" width="1" height="1" alt="" style="display:block; border:0; width:1px; height:1px;">
</body>
</html>
