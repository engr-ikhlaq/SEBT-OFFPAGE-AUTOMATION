<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:560px; background:#ffffff; border-radius:8px;" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding:32px; color:#111827; font-size:15px; line-height:1.6;">
              {{ message | safe }}
              <p style="margin:24px 0;">
                <a href="{{ link_url }}" style="background:#2563eb; color:#ffffff; padding:10px 18px; border-radius:6px; text-decoration:none; display:inline-block;">
                  {{ link_text }}
                </a>
              </p>
            </td>
          </tr>
          {% include "_email_footer.html" %}
        </table>
      </td>
    </tr>
  </table>
  <img src="{{ pixel_url }}" width="1" height="1" alt="" style="display:block; border:0; width:1px; height:1px;">
</body>
</html>
